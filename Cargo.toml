[package]
name = "spop"
version = "0.12.0"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "Library for parsing HAProxy SPOP (Stream Processing Offload Protocol)"
documentation = "https://docs.rs/spop/latest/spop/"
repository = "https://github.com/nbari/spop"
readme = "README.md"
keywords = ["haproxy", "spop", "spoe"]
categories = ["network-programming"]
license = "BSD-3-Clause"
edition = "2024"

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
bytes = "1"
nom = "8.0"
semver = "1.0"
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["codec"] }

# Used only by the examples, the benchmarks and the doctests. Keeping them out of
# [dependencies] matters most for tokio: declaring features = ["full"] here would union those
# features into every downstream build, whether or not that crate wants fs, process, signal and
# the rest. tokio-util pulls the pieces the codec actually needs on its own.
[dev-dependencies]
anyhow = "1"
criterion = { version = "0.8.2", features = ["html_reports"] }
futures = "0.3"
rand = "0.10"
tokio = { version = "1.53", features = ["full"] }

[lib]
name = "spop"
path = "src/lib.rs"

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "frames"
harness = false

[[bench]]
name = "roundtrip"
harness = false

[[example]]
name = "agent_socket"
path = "examples/agent_socket.rs"

[[example]]
name = "agent_tcp"
path = "examples/agent_tcp.rs"
