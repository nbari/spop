[test]
spoe-agent test
    messages    check-client-ip log-request
    option      var-prefix spoe_test
    option      continue-on-error
    timeout     processing 10ms
    use-backend spoe-test
    log         global

spoe-message check-client-ip
    args ip=src # can't use hdr() here as it's not available
    event on-client-session

spoe-message log-request
    args ip=src country=hdr(CF-IPCountry) user_agent=hdr(User-Agent) src dst # src and dst are unnamed
    event on-frontend-http-request

[test-socket]
spoe-agent test-socket
    messages    check-client-ip log-request
    option      var-prefix spoe_test_socket
    option      continue-on-error
    timeout     processing 10ms
    use-backend spoe-test-socket
    log         global

spoe-message check-client-ip
    args ip=src # can't use hdr() here as it's not available
    event on-client-session

spoe-message log-request
    args ip=src country=hdr(CF-IPCountry) user_agent=hdr(User-Agent) src dst # src and dst are unnamed
    event on-frontend-http-request

[args]
spoe-agent args
    messages    echo-args
    option      var-prefix spoe_args
    option      continue-on-error
    timeout     processing 10ms
    use-backend spoe-args
    log         global

# Answered by examples/agent_args.rs. Unnamed arguments (str(first), src, str(second)) arrive
# with empty names in this order, `country` is declared twice so the agent must take the first,
# and bad\xff is not valid UTF-8 (\xNN is HAProxy's config escape for a raw byte).
spoe-message echo-args
    args answer=int(42) str(first) src country=hdr(CF-IPCountry) country=str(shadowed) str(second) bad\xff=str(lossy)
    event on-frontend-http-request
